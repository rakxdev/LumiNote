<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="lumiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Glow Aura -->
  <circle cx="50" cy="50" r="44" fill="rgba(139, 92, 246, 0.08)" />
  
  <!-- Outer Gradient Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#lumiGrad)" stroke-width="4.5" filter="url(#glow)" opacity="0.9" />
  
  <!-- Dynamic Luminous Soundwave Bars -->
  <rect x="24" y="42" width="6" height="16" rx="3" fill="#8b5cf6" />
  <rect x="34" y="32" width="6" height="36" rx="3" fill="url(#lumiGrad)" />
  <rect x="44" y="20" width="8" height="60" rx="4" fill="#ffffff" filter="url(#glow)" />
  <rect x="56" y="28" width="6" height="44" rx="3" fill="url(#lumiGrad)" />
  <rect x="66" y="38" width="6" height="24" rx="3" fill="#06b6d4" />
  
  <!-- Luminous Spark Particles -->
  <circle cx="48" cy="12" r="3.5" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="84" cy="50" r="2.5" fill="#ec4899" />
  <circle cx="16" cy="50" r="2.5" fill="#8b5cf6" />
  <circle cx="48" cy="88" r="3" fill="#8b5cf6" filter="url(#glow)" />
</svg>