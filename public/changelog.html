<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Changelog • LumiNote</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="reset.css" />
    <style>
      :root {
        --font-display: "Chakra Petch", sans-serif;
        --font-body: "Martel", serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
        --gold: #d9b64a;
        --gold-deep: #b8952f;
        --amber: #d9a441;
        --emerald: #10b981;
        --panel-chassis: #0f1217;
        --panel-inner: #080a0e;
        --panel-border: #1f242d;
        --ink-primary: #f5f2e9;
        --ink-dim: #8e9588;
        --ink-muted: #565d50;
      }
      html, body { height: 100%; }
      body {
        background: var(--panel-inner);
        background-image:
          radial-gradient(1000px 500px at 75% -10%, rgba(217, 182, 74, 0.10) 0%, transparent 60%),
          radial-gradient(800px 400px at 15% 95%, rgba(232, 69, 44, 0.05) 0%, transparent 55%);
        color: var(--ink-primary);
        font-family: var(--font-body);
        line-height: 1.65;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2.5rem 1rem 4rem;
      }
      /* Full-fluid like the studio: no narrow centered column — the page
         spans the viewport with the same fluid gutters (user request). */
      .cl-shell { width: 100%; max-width: none; }
      body { padding: 2.5rem clamp(0.75rem, 2.5vw, 2.5rem) 4rem; }
      header.cl-top {
        display: flex; align-items: baseline; justify-content: space-between;
        gap: 1rem; border-bottom: 1px dashed rgba(217, 182, 74, 0.25);
        padding-bottom: 1rem; margin-bottom: 2rem;
      }
      .cl-brand { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: 0.02em; }
      .cl-brand em { color: var(--gold); font-style: normal; }
      .cl-back { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); text-decoration: none; border: 1px solid var(--panel-border); padding: 0.35rem 0.7rem; border-radius: 3px; }
      .cl-back:hover, .cl-back:focus-visible { color: var(--gold); border-color: var(--gold-deep); }
      .cl-entry { margin-bottom: 2.25rem; }
      .cl-entry-head { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
      .cl-version { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: var(--gold); }
      .cl-date { font-family: var(--font-mono); font-size: 0.68rem; color: var(--ink-muted); letter-spacing: 0.06em; }
      .cl-status { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.35); padding: 0.1rem 0.45rem; border-radius: 2px; }
      .cl-section { margin-top: 0.85rem; }
      .cl-section h2 { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 0.4rem; }
      .cl-section.added h2 { color: var(--emerald); }
      .cl-section.changed h2 { color: var(--amber); }
      .cl-section.fixed h2 { color: var(--gold); }
      .cl-section ul { list-style: none; }
      .cl-section li { padding-left: 1.1rem; position: relative; font-size: 0.92rem; color: var(--ink-primary); margin-bottom: 0.35rem; }
      .cl-section li::before { content: "—"; position: absolute; left: 0; color: var(--ink-muted); }
      .cl-empty, .cl-error { font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-dim); border: 1px dashed var(--panel-border); padding: 1.25rem; text-align: center; border-radius: 4px; }
      footer.cl-foot { margin-top: 3rem; font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
    </style>
</head>
<body>
    <div class="cl-shell">
        <header class="cl-top">
            <div class="cl-brand">Lumi<em>Note</em> — Changelog</div>
            <a class="cl-back" href="/">← Back to Studio</a>
        </header>

        <main id="changelogRoot" aria-live="polite">
            <div class="cl-empty">Loading changelog…</div>
        </main>

        <footer class="cl-foot">Keep a Changelog • one source feeds this page and the app's version seal</footer>
    </div>

    <script type="module">
    const root = document.getElementById('changelogRoot');
    try {
      const res = await fetch('./changelog.json');
      if (!res.ok) throw new Error(`changelog.json returned ${res.status}`);
      const log = await res.json();
      const entries = Array.isArray(log.entries) ? log.entries : [];
      if (!entries.length) throw new Error('no entries');
      root.innerHTML = '';
      for (const entry of entries) {
        const article = document.createElement('article');
        article.className = 'cl-entry';

        const head = document.createElement('div');
        head.className = 'cl-entry-head';
        const version = document.createElement('span');
        version.className = 'cl-version';
        version.textContent = `v${entry.version}`;
        const date = document.createElement('span');
        date.className = 'cl-date';
        date.textContent = entry.date || '';
        const status = document.createElement('span');
        status.className = 'cl-status';
        status.textContent = entry.status || 'released';
        head.append(version, date, status);
        article.appendChild(head);

        for (const [name, items] of Object.entries(entry.sections || {})) {
          if (!Array.isArray(items) || !items.length) continue;
          const section = document.createElement('section');
          section.className = `cl-section ${name}`;
          const h = document.createElement('h2');
          h.textContent = name;
          section.appendChild(h);
          const ul = document.createElement('ul');
          for (const item of items) {
            const li = document.createElement('li');
            li.textContent = item;
            ul.appendChild(li);
          }
          section.appendChild(ul);
          article.appendChild(section);
        }
        root.appendChild(article);
      }
    } catch (err) {
      root.innerHTML = '';
      const p = document.createElement('div');
      p.className = 'cl-error';
      p.textContent = `Changelog unavailable (${err.message}).`;
      root.appendChild(p);
    }
    </script>
</body>
</html>
