<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Changelog • LumiNote</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="standalone.css" />
    <style>
      .cl-entry-head {
        display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.5rem;
      }
      .cl-version { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: var(--gold); }
      .cl-date { font-family: var(--font-mono); font-size: 0.68rem; color: var(--ink-muted); letter-spacing: 0.06em; }
      .cl-status {
        font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.35); padding: 0.1rem 0.45rem; border-radius: 2px;
      }
      .cl-section { margin-top: 0.85rem; }
      .cl-section h2 {
        font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
        letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); margin: 0 0 0.4rem;
      }
      .cl-section.added h2 { color: var(--emerald); }
      .cl-section.changed h2 { color: var(--amber); }
      .cl-section.fixed h2 { color: var(--gold); }
      .cl-section.security h2 { color: var(--red); }
      .cl-section ul { list-style: none; margin: 0; padding: 0; }
      .cl-section li { padding-left: 1.1rem; position: relative; font-size: 0.92rem; margin-bottom: 0.35rem; }
      .cl-section li::before { content: "—"; position: absolute; left: 0; color: var(--ink-muted); }
      .cl-empty, .cl-error {
        font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-dim);
        border: 1px dashed var(--panel-border); padding: 1.25rem; text-align: center; border-radius: 4px;
      }
    </style>
</head>
<body>
    <aside class="st-pillar" aria-hidden="true">
        <div class="st-pillar-om">ॐ</div>
        <div class="st-pillar-text">नादब्रह्म</div>
        <div class="st-pillar-year">VĀK 2026</div>
    </aside>

    <div class="st-shell">
        <header class="st-chassis">
            <div class="st-brand">
                <img class="st-logo" src="logo.svg" alt="LumiNote Acoustic Yantra logo">
                <div class="st-brand-title">
                    <h1>Lumi<em>Note</em><span class="st-fuse-badge">CHANGELOG</span></h1>
                </div>
            </div>
            <nav class="st-nav" aria-label="Page navigation">
                <a class="st-btn" href="/">Studio</a>
                <a class="st-btn" href="/credits">Credits</a>
                <a class="st-btn" href="https://github.com/rakxdev/LumiNote">Repository</a>
            </nav>
        </header>

        <main class="st-panel" aria-live="polite">
            <div id="changelogRoot">
                <div class="cl-empty">Loading changelog…</div>
            </div>
        </main>

        <footer class="st-footer">
            <span>Keep a Changelog • one source feeds this page and the app's version seal</span>
            <span>© 2026 rakxdev • MIT</span>
        </footer>
    </div>

    <script type="module" src="changelog-app.js"></script>
</body>
</html>
