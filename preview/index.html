<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumiNote Master Showcase — 3 Radically Distinct Concepts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Syne:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b0e;
      --card-bg: #13161c;
      --border: rgba(217, 182, 74, 0.25);
      --gold: #d9b64a;
      --text: #f8fafc;
      --text-muted: #8a9184;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(13, 16, 22, 0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fff;
    }
    .brand h1 em {
      font-style: normal;
      color: var(--gold);
    }
    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      background: rgba(217, 182, 74, 0.15);
      border: 1px solid var(--border);
      color: var(--gold);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-weight: 700;
    }
    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.3rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.55rem 1.15rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active {
      background: linear-gradient(150deg, var(--gold), #b8952f);
      color: #1a1508;
      box-shadow: 0 4px 15px rgba(217, 182, 74, 0.35);
    }
    .preview-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    iframe {
      width: 100%;
      height: calc(100vh - 75px);
      border: none;
      background: #000;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Lumi<em>Note</em></h1>
      <span class="badge">DESIGN LAB // 3 UNIQUE WORLDS</span>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchOption('/fusion-master.html', this)">
        <span>⚡ 1: RodeX x Neo-Mirai x Sanskrit Fusion (Recommended)</span>
      </button>
      <button class="tab-btn" onclick="switchOption('/option-1-vedic.html', this)">
        <span>🕉️ 2: Classical Sanskrit Vāk & Nāda</span>
      </button>
      <button class="tab-btn" onclick="switchOption('/option-3-sovereign.html', this)">
        <span>👑 3: Sovereign Champagne & Titanium Glass</span>
      </button>
    </div>
  </header>

  <div class="preview-container">
    <iframe id="previewFrame" src="/fusion-master.html"></iframe>
  </div>

  <script>
    function switchOption(url, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('previewFrame').src = url;
    }
  </script>
</body>
</html>
