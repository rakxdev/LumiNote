<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option B: Aircraft Cockpit Avionics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cockpit-bg: #05070a;
      --panel: #0d1117;
      --panel-border: #1f2937;
      --radium-green: #22c55e;
      --avionics-cyan: #38bdf8;
      --caution-amber: #fbbf24;
      --alert-red: #f43f5e;
      --text-phosphor: #e2e8f0;
      --font-mono: 'Share Tech Mono', monospace;
      --font-display: 'Rajdhani', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--cockpit-bg);
      color: var(--text-phosphor);
      font-family: var(--font-mono);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 1.25rem 2rem;
      overflow: hidden;
    }

    /* Avionics Glare Shield Header */
    .cockpit-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .callsign {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--avionics-cyan);
    }
    .flight-gauges {
      display: flex;
      gap: 1.5rem;
      font-size: 0.8rem;
    }
    .gauge-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .gauge-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--radium-green);
    }
    .gauge-lbl { font-size: 0.65rem; color: #64748b; }

    /* Central Primary Flight Display (PFD) */
    .pfd-chassis {
      flex: 1;
      margin: 1rem 0;
      background: #020408;
      border: 2px solid #1e293b;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
    }
    .attitude-crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 1px;
      background: rgba(56, 189, 248, 0.15);
      pointer-events: none;
    }
    .pfd-screen {
      flex: 1;
      padding: 2rem;
      font-size: 1.25rem;
      line-height: 1.7;
      color: var(--text-phosphor);
      outline: none;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .pfd-screen:empty::before {
      content: "[STANDBY] ENGAGE SPEECH TRANSMITTER VIA HOT MIC SWITCH...";
      color: #334155;
    }
    .live-telemetry-token {
      color: var(--radium-green);
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 0.1rem 0.3rem;
      border-radius: 2px;
    }

    /* Pedestal Controls */
    .pedestal-deck {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
    }
    .avionics-btn {
      background: #111827;
      border: 1px solid #374151;
      color: var(--text-phosphor);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .avionics-btn:hover {
      background: #1f2937;
      border-color: var(--avionics-cyan);
    }
    .master-transmit-switch {
      background: linear-gradient(180deg, #dc2626 0%, #7f1d1d 100%);
      border: 1px solid #ef4444;
      color: #fff;
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 0.75rem 2rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }
    .annunciator-led {
      width: 8px;
      height: 8px;
      background: #fca5a5;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
    }
  </style>
</head>
<body>
  <header class="cockpit-header">
    <div class="callsign">LUMINOTE // AVIONICS</div>
    <div class="flight-gauges">
      <div class="gauge-item"><span class="gauge-val">16.0 kHz</span><span class="gauge-lbl">SAMPLE RATE</span></div>
      <div class="gauge-item"><span class="gauge-val">150 ms</span><span class="gauge-lbl">STREAM LATENCY</span></div>
      <div class="gauge-item"><span class="gauge-val">NOVA-3</span><span class="gauge-lbl">ENGINE ACTIVE</span></div>
    </div>
    <div style="text-align:right; font-size:0.75rem; color:var(--radium-green);">COM 1: CONNECTED</div>
  </header>

  <main class="pfd-chassis">
    <div class="attitude-crosshair"></div>
    <div class="pfd-screen" contenteditable="true">
      Avionics speech intelligence channel initialized. <span class="live-telemetry-token">STREAMING REALTIME PCM S16LE AUDIO...</span> Real-time speech to text conversion in high-fidelity cockpit glass.
    </div>
  </main>

  <footer class="pedestal-deck">
    <div style="display:flex; gap:0.6rem;">
      <button class="avionics-btn">RESET CANV</button>
      <button class="avionics-btn">AUTOCORRECT</button>
      <button class="avionics-btn">COPY CLIP</button>
      <button class="avionics-btn">LOG EXPORT</button>
    </div>

    <button class="master-transmit-switch">
      <span class="annunciator-led"></span>
      <span>HOT MIC / TRANSMIT</span>
    </button>
  </footer>
</body>
</html>
