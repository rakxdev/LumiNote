<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option 3 - Obsidian Void</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --void-black: #000000;
      --void-surface: #0a0a0a;
      --amber-glow: #f59e0b;
      --text-ivory: #fafaf9;
      --text-ash: #78716c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--void-black);
      color: var(--text-ivory);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 3rem 4rem;
      overflow: hidden;
    }

    /* Minimal Floating Navigation */
    .void-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .void-title {
      font-family: 'Instrument Serif', serif;
      font-size: 2rem;
      font-style: italic;
      color: #fff;
    }
    .void-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-ash);
    }

    /* Distraction-Free Typography Stream */
    .void-editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 840px;
      margin: 0 auto;
      width: 100%;
    }
    .void-editor {
      font-family: 'Instrument Serif', serif;
      font-size: 2.2rem;
      line-height: 1.5;
      color: var(--text-ivory);
      outline: none;
    }
    .amber-caret {
      display: inline-block;
      width: 10px;
      height: 2rem;
      background: var(--amber-glow);
      box-shadow: 0 0 12px var(--amber-glow);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 1s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Floating Minimal Action Dot */
    .void-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 2rem;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .void-btn-group {
      display: flex;
      gap: 1.5rem;
    }
    .void-link {
      background: none;
      border: none;
      color: var(--text-ash);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      cursor: pointer;
      transition: color 0.2s;
    }
    .void-link:hover { color: #fff; }

    .void-record-orb {
      background: #1c1917;
      border: 1px solid #44403c;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.7rem 1.6rem;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .orb-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber-glow); box-shadow: 0 0 8px var(--amber-glow); }
  </style>
</head>
<body>
  <header class="void-header">
    <h1 class="void-title">LumiNote</h1>
    <div class="void-meta">OBSIDIAN VOID • ASSEMBLYAI 3.5 PRO</div>
  </header>

  <main class="void-editor-container">
    <div class="void-editor" contenteditable="true">
      Words appear naturally into the quiet dark void. Thought transforms effortlessly to type without mechanical friction.<span class="amber-caret"></span>
    </div>
  </main>

  <footer class="void-actions">
    <div class="void-btn-group">
      <button class="void-link">Clear</button>
      <button class="void-link">Polish Grammar</button>
      <button class="void-link">Copy</button>
      <button class="void-link">Export</button>
    </div>

    <button class="void-record-orb">
      <span class="orb-dot"></span>
      <span>Speak</span>
    </button>
  </footer>
</body>
</html>
