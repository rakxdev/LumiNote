<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option 4 - Modern Linear/Raycast Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.25rem 2rem;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.15rem;
    }
    .model-selector {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    main {
      flex: 1;
      margin: 1.25rem 0;
      background: rgba(14, 17, 26, 0.6);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      font-size: 1.15rem;
      line-height: 1.7;
      outline: none;
    }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-group {
      display: flex;
      gap: 0.5rem;
    }
    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { color: #fff; border-color: rgba(255,255,255,0.2); }
    .rec-btn {
      background: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);
      color: #fff;
      border: none;
      padding: 0.75rem 1.75rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div style="width:24px;height:24px;background:#8b5cf6;border-radius:6px;"></div>
      <span>LumiNote</span>
    </div>
    <div class="model-selector">
      <span style="color:#10b981;">●</span>
      <span>AssemblyAI Universal-3.5 Pro</span>
      <span>▼</span>
    </div>
  </header>

  <main contenteditable="true">
    A clean, modern SaaS interface in the style of Linear, Raycast, and modern developer tooling. Fast, familiar, and predictable.
  </main>

  <footer>
    <div class="btn-group">
      <button class="btn">Clear</button>
      <button class="btn">Fix Grammar</button>
      <button class="btn">Copy</button>
      <button class="btn">Export</button>
    </div>
    <button class="rec-btn">Start Recording</button>
  </footer>
</body>
</html>
