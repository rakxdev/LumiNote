<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LumiNote — Sovereign Champagne & Obsidian Glass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       OPTION 3: SOVEREIGN CHAMPAGNE (Luxury AI SaaS Modernist)
       ========================================================================== */

    :root {
      --font-display: "Syne", sans-serif;
      --font-body: "Plus Jakarta Sans", sans-serif;
      --font-mono: "JetBrains Mono", monospace;
      --gold-gradient: linear-gradient(135deg, #f5d77f 0%, #d4af37 50%, #aa7c11 100%);
      --gold-solid: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.4);
    }

    /* 🌙 DARK MODE: Deep Obsidian Titanium Glass & Floating Champagne Gold */
    html[data-theme="dark"] {
      --bg: #07080c;
      --ambient: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.1) 0%, transparent 60%);
      --card-bg: rgba(18, 20, 28, 0.85);
      --card-border: rgba(212, 175, 55, 0.25);
      --card-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.08);
      --editor-bg: #0a0c12;
      
      --text: #f8fafc;
      --text-muted: #94a3b8;
      
      --btn-bg: rgba(24, 28, 40, 0.9);
      --btn-border: rgba(212, 175, 55, 0.2);
      --btn-text: #f8fafc;
      --btn-shadow: 0 4px 15px rgba(0,0,0,0.4);

      --live-color: #fde047;
      --live-bg: rgba(212, 175, 55, 0.15);
      --live-border: #d4af37;
    }

    /* ☀️ LIGHT MODE: Warm French Silk Canvas & Polished Gold Foil */
    html[data-theme="light"] {
      --bg: #faf7f2;
      --ambient: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.15) 0%, transparent 60%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(212, 175, 55, 0.3);
      --card-shadow: 0 20px 40px rgba(70, 50, 20, 0.06), 0 0 0 1px rgba(212, 175, 55, 0.2);
      --editor-bg: #ffffff;

      --text: #171512;
      --text-muted: #6b6355;

      --btn-bg: #ffffff;
      --btn-border: rgba(212, 175, 55, 0.35);
      --btn-text: #171512;
      --btn-shadow: 0 2px 8px rgba(70, 50, 20, 0.05);

      --live-color: #9a7209;
      --live-bg: rgba(212, 175, 55, 0.12);
      --live-border: #d4af37;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100vh;
      height: 100dvh;
      max-height: 100vh;
      max-height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      background-image: var(--ambient);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      transition: all 0.3s ease;
    }

    .sovereign-container {
      max-width: 1340px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem 2.5rem;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-height: 100vh;
      max-height: 100dvh;
      overflow: hidden;
    }

    /* Top Bar */
    .sovereign-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(16px);
      flex-shrink: 0;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }
    .gold-emblem {
      width: 32px;
      height: 32px;
      background: var(--gold-gradient);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #09090b;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 0 15px var(--gold-glow);
    }
    .brand-title {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .gold-edition-badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gold-solid);
      border: 1px solid var(--gold-solid);
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      margin-left: 0.5rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .mode-btn {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-text);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.5rem 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: var(--btn-shadow);
    }

    /* Central Silk Desk */
    .sovereign-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin: 1.25rem 0;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      padding: 1.25rem;
      position: relative;
    }

    .workspace-top-rail {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.775rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .silk-editor-zone {
      flex: 1;
      margin: 1rem 0;
      background: var(--editor-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 2.25rem 2.75rem;
      font-size: 1.4rem;
      line-height: 1.85;
      color: var(--text);
      outline: none;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .silk-editor-zone:empty::before {
      content: "Speak into the sovereign audio workspace... Your voice transcribes in golden clarity.";
      color: var(--text-muted);
    }

    .live-gold-token {
      color: var(--live-color);
      background: var(--live-bg);
      border-bottom: 2px solid var(--live-border);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      font-weight: 600;
    }

    .workspace-bottom-rail {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid var(--card-border);
      font-size: 0.775rem;
      color: var(--text-muted);
    }

    /* Controls */
    .sovereign-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .tool-group {
      display: flex;
      gap: 0.6rem;
    }
    .gold-btn {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-text);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: var(--btn-shadow);
      transition: all 0.2s ease;
    }
    .gold-btn:hover {
      border-color: var(--gold-solid);
      transform: translateY(-1px);
    }

    .sovereign-dictate-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--gold-gradient);
      border: none;
      color: #09090b;
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      padding: 0.8rem 2.25rem;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 8px 25px var(--gold-glow);
      transition: transform 0.2s ease;
    }
    .sovereign-dictate-btn:hover {
      transform: translateY(-2px) scale(1.02);
    }
  </style>
</head>
<body>
  <div class="sovereign-container">
    <header class="sovereign-header">
      <div class="brand-cluster">
        <div class="gold-emblem">L</div>
        <div class="brand-title">LumiNote</div>
        <span class="gold-edition-badge">Sovereign Edition</span>
      </div>

      <div class="header-actions">
        <button class="mode-btn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeLabel">Light Mode</span>
        </button>

        <div style="font-size:0.8rem; font-weight:700; color:var(--gold-solid);">
          ● NOVA-3 • 150MS
        </div>
      </div>
    </header>

    <main class="sovereign-workspace">
      <div class="workspace-top-rail">
        <span>PCM S16LE • 16.0 kHz LOSSLESS</span>
        <span style="color:var(--gold-solid);">✨ REAL-TIME CLARITY ACTIVE</span>
      </div>

      <div class="silk-editor-zone" contenteditable="true">
        Experience speech intelligence crafted like fine jewelry. <span class="live-gold-token">Every spoken phrase transforms into golden typography in real-time...</span>
      </div>

      <div class="workspace-bottom-rail">
        <span>24 WORDS • 162 CHARACTERS</span>
        <span>PRESS [SPACE] OR CLICK TO DICTATE</span>
      </div>
    </main>

    <footer class="sovereign-controls">
      <div class="tool-group">
        <button class="gold-btn">⟲ Clear</button>
        <button class="gold-btn">✨ Polish Grammar</button>
        <button class="gold-btn">📋 Copy [⌘C]</button>
        <button class="gold-btn">⤓ Export</button>
      </div>

      <button class="sovereign-dictate-btn">
        <span style="width:8px;height:8px;background:#09090b;border-radius:50%;"></span>
        <span>Start Dictating</span>
      </button>
    </footer>
  </div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const cur = html.getAttribute('data-theme') || 'dark';
      const next = cur === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      document.getElementById('themeIcon').textContent = next === 'dark' ? '☀️' : '🌙';
      document.getElementById('themeLabel').textContent = next === 'dark' ? 'Light Mode' : 'Dark Mode';
    }
  </script>
</body>
</html>
