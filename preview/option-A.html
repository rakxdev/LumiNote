<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option A: Swiss Typographic Editorial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0d10;
      --paper: #12141a;
      --border: rgba(255, 255, 255, 0.08);
      --vermilion: #ff4d36;
      --text: #f4f4f6;
      --text-muted: #848794;
      --font-serif: 'Newsreader', serif;
      --font-sans: 'Instrument Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 2.5rem;
      overflow: hidden;
    }

    /* Grid Layout */
    .editorial-shell {
      flex: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    /* Masthead */
    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 2px solid var(--text);
      padding-bottom: 0.75rem;
    }
    .masthead-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }
    .masthead-issue {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    /* Reading Canvas */
    .reading-canvas-wrap {
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .reading-meta {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      text-transform: uppercase;
    }
    .reading-editor {
      flex: 1;
      font-family: var(--font-serif);
      font-size: 1.85rem;
      line-height: 1.65;
      color: var(--text);
      outline: none;
      overflow-y: auto;
      white-space: pre-wrap;
      font-optical-sizing: auto;
    }
    .reading-editor:empty::before {
      content: "Speak to print your thoughts into text. Click record below to stream audio in real-time.";
      color: #3b3e4f;
      font-style: italic;
    }
    .live-clause {
      color: var(--vermilion);
      border-bottom: 1px solid var(--vermilion);
      font-style: italic;
    }

    /* Precision Swiss Toolbar */
    .swiss-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }
    .model-badge-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .engine-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.725rem;
      padding: 0.4rem 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .engine-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      font-weight: 700;
    }
    .action-tools {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .tool-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color 0.15s;
    }
    .tool-link:hover { color: var(--text); }
    .rec-trigger {
      background: var(--vermilion);
      color: #fff;
      border: none;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.65rem 1.4rem;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="editorial-shell">
    <header class="masthead">
      <div class="masthead-title">LumiNote Studio</div>
      <div class="masthead-issue">ISSUE 03 • SPEECH INTELLIGENCE DRAFTING</div>
    </header>

    <main class="reading-canvas-wrap">
      <div class="reading-meta">
        <span>SESSION: 00:02:14</span>
        <span>LATENCY: ~150MS (DEEPGRAM NOVA-3)</span>
        <span>WORDS: 28</span>
      </div>

      <div class="reading-editor" contenteditable="true">Every thought transcribed here is rendered with editorial precision and proportion. <span class="live-clause">Streaming words emerge like ink on fine paper...</span></div>
    </main>

    <footer class="swiss-toolbar">
      <div class="model-badge-group">
        <button class="engine-btn active">Deepgram Nova-3</button>
        <button class="engine-btn">AssemblyAI Pro</button>
      </div>

      <div class="action-tools">
        <button class="tool-link">Clear</button>
        <button class="tool-link">Polish Grammar</button>
        <button class="tool-link">Copy [⌘C]</button>
        <button class="tool-link">Export .TXT</button>
        <button class="rec-trigger">● Dictate</button>
      </div>
    </footer>
  </div>
</body>
</html>
