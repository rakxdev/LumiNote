<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option 1 - Master Studio Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=General+Sans:wght@400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ground: #07080a;
      --chassis: #10121a;
      --chassis-elevated: #161a26;
      --channel-strip: #121520;
      --border-milled: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(245, 158, 11, 0.3);
      --text: #f8fafc;
      --text-dim: #717d96;
      --amber-lamp: #f59e0b;
      --emerald-led: #10b981;
      --tally-red: #ef4444;
      --violet-meter: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--ground);
      color: var(--text);
      font-family: 'General Sans', sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 1.25rem 2rem;
      background-image: 
        radial-gradient(ellipse 50% 30% at 50% 0%, rgba(245, 158, 11, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 80% 100%, rgba(16, 185, 129, 0.04) 0%, transparent 70%);
      overflow: hidden;
    }

    /* Console Top Header */
    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1.25rem;
      background: var(--chassis);
      border: 1px solid var(--border-milled);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .brand-section {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .tape-spool-icon {
      width: 32px;
      height: 32px;
      border: 2px solid var(--amber-lamp);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
      animation: spinSlow 8s linear infinite;
    }
    .tape-spool-icon::before {
      content: '';
      width: 10px;
      height: 10px;
      background: var(--amber-lamp);
      border-radius: 50%;
    }
    @keyframes spinSlow { 100% { transform: rotate(360deg); } }
    .brand-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .unit-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--amber-lamp);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.25);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-weight: 700;
    }

    /* Dual Optical VU Meter */
    .vu-meter-rack {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      background: #090b10;
      border: 1px solid rgba(255,255,255,0.05);
      padding: 0.5rem 1rem;
      border-radius: 10px;
    }
    .vu-channel {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .vu-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-dim);
      font-weight: 800;
    }
    .vu-bar-track {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 14px;
    }
    .vu-segment {
      width: 4px;
      height: 100%;
      background: rgba(255,255,255,0.08);
      border-radius: 1px;
    }
    .vu-segment.active-green { background: var(--emerald-led); box-shadow: 0 0 6px var(--emerald-led); }
    .vu-segment.active-amber { background: var(--amber-lamp); box-shadow: 0 0 6px var(--amber-lamp); }
    .vu-segment.active-red { background: var(--tally-red); box-shadow: 0 0 6px var(--tally-red); }

    /* Engine Selector Dial */
    .engine-dial {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--chassis-elevated);
      border: 1px solid var(--border-milled);
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
    }
    .engine-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald-led);
      box-shadow: 0 0 8px var(--emerald-led);
    }

    /* Center Drafting Console */
    .workspace-chassis {
      flex: 1;
      margin: 1rem 0;
      background: var(--channel-strip);
      border: 1px solid var(--border-milled);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.6), 0 15px 40px rgba(0,0,0,0.4);
      position: relative;
    }
    .canvas-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border-milled);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.725rem;
      color: var(--text-dim);
    }
    .stream-status-pill {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--amber-lamp);
      background: rgba(245, 158, 11, 0.08);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
    .editor-canvas {
      flex: 1;
      padding: 1.75rem 2rem;
      font-size: 1.2rem;
      line-height: 1.8;
      color: #f1f5f9;
      outline: none;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .editor-canvas:empty::before {
      content: "Press [REC] or Spacebar to engage live streaming dictation...";
      color: var(--text-dim);
    }
    .live-stream-ribbon {
      color: var(--amber-lamp);
      font-weight: 500;
      border-bottom: 2px solid var(--amber-lamp);
      padding-bottom: 2px;
      background: rgba(245, 158, 11, 0.06);
    }

    /* Bottom Tactile Transport Bar */
    .transport-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1.25rem;
      background: var(--chassis);
      border: 1px solid var(--border-milled);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .tactile-group {
      display: flex;
      gap: 0.6rem;
    }
    .tactile-btn {
      background: var(--chassis-elevated);
      border: 1px solid var(--border-milled);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.775rem;
      font-weight: 700;
      padding: 0.65rem 1.15rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.15s ease;
      box-shadow: 0 3px 0 rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .tactile-btn:hover {
      background: rgba(255,255,255,0.08);
      transform: translateY(-1px);
    }
    .tactile-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.4);
    }

    /* Master Record Engage Key */
    .master-rec-key {
      background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
      border: 1px solid #ef4444;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 0.75rem 2rem;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.4), inset 0 1px 0 rgba(255,255,255,0.2), 0 3px 0 #7f1d1d;
      transition: all 0.15s ease;
    }
    .master-rec-key:hover {
      box-shadow: 0 8px 25px rgba(220, 38, 38, 0.6), inset 0 1px 0 rgba(255,255,255,0.3);
      transform: translateY(-1px);
    }
    .tally-lamp {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fca5a5;
      box-shadow: 0 0 10px #ef4444;
      animation: blink 1.2s ease infinite;
    }
    @keyframes blink { 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <!-- Master Broadcast Header -->
  <header class="console-header">
    <div class="brand-section">
      <div class="tape-spool-icon"></div>
      <h1 class="brand-title">LumiNote</h1>
      <span class="unit-tag">CONSOLE v03</span>
    </div>

    <!-- Dual Channel VU Optical Level Display -->
    <div class="vu-meter-rack">
      <div class="vu-channel">
        <span class="vu-label">L</span>
        <div class="vu-bar-track">
          <div class="vu-segment active-green"></div>
          <div class="vu-segment active-green"></div>
          <div class="vu-segment active-green"></div>
          <div class="vu-segment active-green"></div>
          <div class="vu-segment active-amber"></div>
          <div class="vu-segment active-amber"></div>
          <div class="vu-segment"></div>
          <div class="vu-segment"></div>
        </div>
      </div>
      <div class="vu-channel">
        <span class="vu-label">R</span>
        <div class="vu-bar-track">
          <div class="vu-segment active-green"></div>
          <div class="vu-segment active-green"></div>
          <div class="vu-segment active-green"></div>
          <div class="vu-segment active-green"></div>
          <div class="vu-segment active-amber"></div>
          <div class="vu-segment"></div>
          <div class="vu-segment"></div>
          <div class="vu-segment"></div>
        </div>
      </div>
    </div>

    <div class="engine-dial">
      <span class="engine-dot"></span>
      <span>ASSEMBLYAI PRO • 16kHz</span>
      <span style="color:var(--text-dim);">▼</span>
    </div>
  </header>

  <!-- Central Acoustic Canvas -->
  <main class="workspace-chassis">
    <div class="canvas-toolbar">
      <div style="display:flex; gap:1rem; align-items:center;">
        <span>BUFFER: 100ms PCM</span>
        <span>STREAM: WEBSOCKET ACTIVE</span>
      </div>
      <div class="stream-status-pill">
        <span>●</span>
        <span>AWAITING SPEECH SIGNAL</span>
      </div>
    </div>

    <div class="editor-canvas" contenteditable="true">Real-time voice intelligence architecture requires zero-latency stream endpointing. <span class="live-stream-ribbon">This transcript line updates dynamically word-by-word while recording continues...</span></div>
  </main>

  <!-- Bottom Hardware Transport Deck -->
  <footer class="transport-bar">
    <div class="tactile-group">
      <button class="tactile-btn"><span>⟲</span> CLEAR</button>
      <button class="tactile-btn"><span>✨</span> POLISH</button>
      <button class="tactile-btn"><span>📋</span> COPY [⌘C]</button>
      <button class="tactile-btn"><span>⤓</span> EXPORT</button>
    </div>

    <button class="master-rec-key">
      <span class="tally-lamp"></span>
      <span>REC / ENGAGE</span>
    </button>
  </footer>
</body>
</html>
