<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Direction 1: Sanskrit Manuscript & Golden Obsidian (Dual-World)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Martel:wght@300;400;600;700&family=Rozha+One&family=Azeret+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-display: "Cinzel", serif;
      --font-sanskrit: "Yatra One", "Rozha One", serif;
      --font-body: "Martel", serif;
      --font-mono: "Azeret Mono", monospace;
      --font-sans: "Plus Jakarta Sans", sans-serif;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 🌙 DARK MODE: Celestial Obsidian & Glowing Gold Foil (Floating Glass Studio) */
    html[data-theme="dark"] body {
      background: #050609;
      background-image: 
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(217, 160, 40, 0.12) 0%, transparent 65%),
        radial-gradient(ellipse 50% 50% at 85% 90%, rgba(225, 29, 72, 0.08) 0%, transparent 70%),
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: auto, auto, 80px 80px, 80px 80px;
      color: #f8fafc;
    }

    html[data-theme="dark"] .shell-card {
      background: rgba(14, 18, 28, 0.85);
      border: 1px solid rgba(217, 160, 40, 0.25);
      box-shadow: 0 25px 60px -10px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.08);
      border-radius: 20px;
    }

    html[data-theme="dark"] .editor-zone {
      background: #090c14;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: inset 0 2px 12px rgba(0,0,0,0.8);
      border-radius: 14px;
      color: #f1f5f9;
    }

    html[data-theme="dark"] .live-token {
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.15);
      border-bottom: 2px solid #f59e0b;
    }

    html[data-theme="dark"] .tool-btn {
      background: rgba(22, 28, 42, 0.9);
      border: 1px solid rgba(217, 160, 40, 0.25);
      color: #f8fafc;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      border-radius: 8px;
    }

    html[data-theme="dark"] .master-btn {
      background: linear-gradient(135deg, #d9a028 0%, #e11d48 100%);
      color: #ffffff;
      box-shadow: 0 8px 30px rgba(217, 160, 40, 0.4);
      border-radius: 50px;
    }

    /* ☀️ LIGHT MODE: Ancient Royal Palm-Leaf & Red Lacquer Manuscript (Tactile Paper) */
    html[data-theme="light"] body {
      background: #f4ecdf;
      background-image: 
        radial-gradient(circle at 80% 10%, rgba(194, 120, 3, 0.15), transparent 25rem),
        linear-gradient(90deg, rgba(80, 50, 20, 0.04) 1px, transparent 1px),
        linear-gradient(0deg, rgba(80, 50, 20, 0.04) 1px, transparent 1px);
      background-size: auto, 64px 64px, 64px 64px;
      color: #1a1309;
    }

    html[data-theme="light"] .shell-card {
      background: #fdfbf7;
      border: 2px solid #2a1e11;
      box-shadow: 6px 6px 0px #2a1e11;
      border-radius: 0px;
    }

    html[data-theme="light"] .editor-zone {
      background: #fffdf9;
      border: 1.5px solid #3d2b18;
      box-shadow: 4px 4px 0px #e8dcce;
      border-radius: 0px;
      color: #1a1309;
    }

    html[data-theme="light"] .live-token {
      color: #991b1b;
      background: rgba(220, 38, 38, 0.1);
      border-bottom: 2px solid #b91c1c;
    }

    html[data-theme="light"] .tool-btn {
      background: #fdfbf7;
      border: 1.5px solid #2a1e11;
      color: #1a1309;
      box-shadow: 3px 3px 0px #2a1e11;
      border-radius: 0px;
      font-weight: 800;
    }
    html[data-theme="light"] .tool-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #2a1e11;
    }

    html[data-theme="light"] .master-btn {
      background: #b91c1c;
      border: 2px solid #2a1e11;
      color: #ffffff;
      box-shadow: 4px 4px 0px #2a1e11;
      border-radius: 0px;
      font-weight: 800;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 1.25rem 2.5rem;
      overflow: hidden;
      transition: all 0.3s var(--ease);
    }

    .container {
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 1rem;
    }

    /* Header */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1.5rem;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }
    .yantra-gem {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #d9a028 0%, #b91c1c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: var(--font-sanskrit);
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 6px;
    }
    .brand-title {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }
    .sanskrit-sub {
      font-family: var(--font-sanskrit);
      font-size: 0.85rem;
      color: #d9a028;
      margin-left: 0.5rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .theme-toggle {
      padding: 0.45rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid rgba(217, 160, 40, 0.4);
      background: rgba(255,255,255,0.05);
      color: inherit;
      border-radius: 6px;
    }

    /* Workspace */
    .workspace-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
      position: relative;
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding-bottom: 0.85rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .editor-zone {
      flex: 1;
      padding: 2rem 2.5rem;
      font-family: var(--font-body);
      font-size: 1.45rem;
      line-height: 1.85;
      outline: none;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .bottom-status-row {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.725rem;
      padding-top: 0.75rem;
      opacity: 0.7;
    }

    /* Controls */
    .control-deck {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.25rem 0;
    }
    .tool-group {
      display: flex;
      gap: 0.6rem;
    }
    .tool-btn {
      padding: 0.65rem 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.775rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .master-btn {
      padding: 0.75rem 2.25rem;
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="top-header shell-card">
      <div class="brand-box">
        <div class="yantra-gem">ॐ</div>
        <div class="brand-title">LumiNote <span class="sanskrit-sub">वाक् & नाद</span></div>
      </div>

      <div class="header-actions">
        <button class="theme-toggle" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeLabel">Switch Mode</span>
        </button>

        <div style="font-family:var(--font-mono); font-size:0.75rem; font-weight:700; padding:0.45rem 0.85rem; border:1px solid rgba(217,160,40,0.3); border-radius:6px;">
          ● NOVA-3 • 150MS
        </div>
      </div>
    </header>

    <main class="workspace-area shell-card">
      <div class="telemetry-row">
        <span>PCM S16LE • LOSSLESS 16.0 kHz</span>
        <span style="color:#d9a028;">नाद प्रवाह • LIVE ACOUSTIC STREAM</span>
      </div>

      <div class="editor-zone" contenteditable="true">
        Speech transforms with sacred resonance into pristine typography. <span class="live-token">Words stream in real-time with instant editing freedom...</span>
      </div>

      <div class="bottom-status-row">
        <span>24 WORDS • 156 CHARACTERS</span>
        <span>PRESS [SPACE] OR CLICK TO DICTATE</span>
      </div>
    </main>

    <footer class="control-deck">
      <div class="tool-group">
        <button class="tool-btn">⟲ Clear</button>
        <button class="tool-btn">✨ Polish AI</button>
        <button class="tool-btn">📋 Copy [⌘C]</button>
        <button class="tool-btn">⤓ Export</button>
      </div>

      <button class="master-btn">
        <span style="width:8px;height:8px;background:#fff;border-radius:50%;"></span>
        <span>Start Dictating</span>
      </button>
    </footer>
  </div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const cur = html.getAttribute('data-theme') || 'dark';
      const next = cur === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      document.getElementById('themeIcon').textContent = next === 'dark' ? '☀️' : '🌙';
      document.getElementById('themeLabel').textContent = next === 'dark' ? 'Switch Mode (Light)' : 'Switch Mode (Dark)';
    }
  </script>
</body>
</html>
