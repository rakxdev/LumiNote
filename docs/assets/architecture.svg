<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-label="LumiNote architecture: devices reach relay rooms through a same-origin WebSocket proxy that owns the auth decision; audio streams device-to-model directly; Pages Functions front D1 storage and the external LanguageTool grammar service">
  <defs>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d9b64a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8452c"/>
    </marker>
    <radialGradient id="aglowGold" cx="80%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#d9b64a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#d9b64a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="agrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Obsidian canvas -->
  <rect x="4" y="4" width="1152" height="612" rx="14" fill="#0a0c0f" stroke="#1f242d" stroke-width="1.5"/>
  <rect x="4" y="4" width="1152" height="612" rx="14" fill="url(#aglowGold)"/>
  <rect x="4" y="4" width="1152" height="612" rx="14" fill="url(#agrid)"/>

  <!-- ===== Devices (left column) ===== -->
  <g>
    <rect x="44" y="80" width="200" height="118" rx="10" fill="#0f1217" stroke="#1f242d" stroke-width="1.5"/>
    <rect x="44" y="80" width="200" height="30" rx="10" fill="#131720"/>
    <text x="62" y="100" font-family="'Chakra Petch',sans-serif" font-size="14" font-weight="700" fill="#d9b64a">PHONE</text>
    <text x="62" y="136" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">dictation · QR join</text>
    <text x="62" y="154" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">clips · push</text>
    <rect x="196" y="126" width="12" height="20" rx="6" fill="none" stroke="#d9b64a" stroke-width="2"/>
    <path d="M 190 140 a 12 12 0 0 0 24 0 M 202 152 v 8 M 196 160 h 12" fill="none" stroke="#d9b64a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="44" y="422" width="200" height="118" rx="10" fill="#0f1217" stroke="#1f242d" stroke-width="1.5"/>
    <rect x="44" y="422" width="200" height="30" rx="10" fill="#131720"/>
    <text x="62" y="442" font-family="'Chakra Petch',sans-serif" font-size="14" font-weight="700" fill="#d9b64a">DESKTOP</text>
    <text x="62" y="478" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">live editor · polish</text>
    <text x="62" y="496" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">library · vocab</text>
    <rect x="196" y="466" width="34" height="22" rx="3" fill="none" stroke="#d9b64a" stroke-width="2"/>
    <path d="M 206 494 h 14" stroke="#d9b64a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ===== Link ws proxy (auth decision point) ===== -->
  <g>
    <rect x="316" y="236" width="200" height="140" rx="10" fill="#0f1217" stroke="#d9b64a" stroke-width="1.5"/>
    <rect x="316" y="236" width="200" height="32" rx="10" fill="#131720"/>
    <text x="334" y="257" font-family="'Chakra Petch',sans-serif" font-size="13" font-weight="700" fill="#d9b64a">LINK /WS PROXY</text>
    <text x="334" y="294" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">room-code validation</text>
    <text x="334" y="312" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">cookie / trust check</text>
    <text x="334" y="330" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">401 · trust headers</text>
    <text x="334" y="358" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565d50">the auth decision point</text>
  </g>

  <!-- ===== SyncRoom DO ===== -->
  <g>
    <rect x="586" y="236" width="220" height="140" rx="10" fill="#0f1217" stroke="#d9b64a" stroke-width="1.5" stroke-dasharray="7 5"/>
    <rect x="586" y="236" width="220" height="32" rx="10" fill="#131720"/>
    <text x="604" y="257" font-family="'Chakra Petch',sans-serif" font-size="13" font-weight="700" fill="#d9b64a">SYNCROOM D-O</text>
    <text x="604" y="294" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">hibernating websockets</text>
    <text x="604" y="312" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">turns · clipboard · levels</text>
    <text x="604" y="330" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">roster · snapshot · ttl</text>
    <text x="604" y="358" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565d50">enforces trust headers</text>
  </g>

  <!-- ===== Right column ===== -->
  <g>
    <rect x="872" y="80" width="264" height="112" rx="10" fill="#0f1217" stroke="#1f242d" stroke-width="1.5"/>
    <rect x="872" y="80" width="264" height="30" rx="10" fill="#131720"/>
    <text x="890" y="100" font-family="'Chakra Petch',sans-serif" font-size="14" font-weight="700" fill="#d9b64a">SPEECH MODELS</text>
    <text x="890" y="136" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">AssemblyAI Universal-3.5 Pro</text>
    <text x="890" y="154" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">Deepgram Nova-3</text>
    <text x="890" y="180" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565d50">keyterms · voice focus · en pinned</text>
  </g>
  <g>
    <rect x="872" y="244" width="264" height="128" rx="10" fill="#0f1217" stroke="#1f242d" stroke-width="1.5"/>
    <rect x="872" y="244" width="264" height="30" rx="10" fill="#131720"/>
    <text x="890" y="264" font-family="'Chakra Petch',sans-serif" font-size="14" font-weight="700" fill="#d9b64a">PAGES FUNCTIONS</text>
    <text x="890" y="300" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">ephemeral STT tokens</text>
    <text x="890" y="318" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">grammar · polish modes</text>
    <text x="890" y="336" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">notes REST · auth · ws proxy</text>
    <text x="890" y="360" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565d50">TOTP login · room trust windows</text>
  </g>
  <g>
    <rect x="872" y="428" width="264" height="112" rx="10" fill="#0f1217" stroke="#1f242d" stroke-width="1.5"/>
    <rect x="872" y="428" width="264" height="30" rx="10" fill="#131720"/>
    <text x="890" y="448" font-family="'Chakra Petch',sans-serif" font-size="14" font-weight="700" fill="#d9b64a">D1 · SQLITE</text>
    <text x="890" y="484" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">notes · clips · transcripts</text>
    <text x="890" y="502" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">app settings · TOTP state</text>
    <text x="890" y="528" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565d50">room_auth windows · 12h</text>
  </g>
  <g>
    <rect x="586" y="506" width="220" height="86" rx="10" fill="#0f1217" stroke="#1f242d" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="586" y="506" width="220" height="30" rx="10" fill="#131720"/>
    <text x="604" y="526" font-family="'Chakra Petch',sans-serif" font-size="13" font-weight="700" fill="#d9b64a">LANGUAGETOOL</text>
    <text x="604" y="560" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">external grammar service</text>
    <text x="604" y="580" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565d50">server-side call · LGPL</text>
  </g>

  <!-- ===== Edges ===== -->
  <!-- Phone audio: direct to STT -->
  <path d="M 244 140 C 470 40, 660 40, 866 128" fill="none" stroke="#e8452c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowRed)"/>
  <text x="500" y="58" font-family="'JetBrains Mono',monospace" font-size="11" fill="#e8452c">16 kHz PCM — device → model directly</text>
  <text x="524" y="76" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8e9588">audio never touches LumiNote servers</text>

  <!-- Devices -> link proxy (dashed gold) -->
  <path d="M 244 190 C 276 220, 288 244, 310 268" fill="none" stroke="#d9b64a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowGold)"/>
  <path d="M 244 440 C 276 410, 288 380, 310 348" fill="none" stroke="#d9b64a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowGold)"/>
  <text x="272" y="216" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8e9588">link/ws</text>
  <text x="262" y="408" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8e9588">link/ws</text>

  <!-- Proxy -> DO (validated upgrade) -->
  <path d="M 516 306 L 580 306" fill="none" stroke="#d9b64a" stroke-width="2" marker-end="url(#arrowGold)"/>
  <text x="520" y="292" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565d50">validated</text>

  <!-- DO -> Desktop (relay back) -->
  <path d="M 586 372 C 500 420, 400 430, 250 436" fill="none" stroke="#d9b64a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowGold)"/>
  <text x="392" y="428" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8e9588">live transcript · roster</text>

  <!-- Devices -> Functions (REST) -->
  <path d="M 244 130 C 540 60, 720 160, 866 282" fill="none" stroke="#565d50" stroke-width="1.6" marker-end="url(#arrowGold)"/>
  <path d="M 244 486 C 540 560, 740 480, 866 356" fill="none" stroke="#565d50" stroke-width="1.6" marker-end="url(#arrowGold)"/>
  <text x="380" y="588" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565d50">notes REST · tokens · auth</text>

  <!-- Functions -> D1 -->
  <path d="M 1004 372 L 1004 422" fill="none" stroke="#d9b64a" stroke-width="1.6" marker-end="url(#arrowGold)"/>
  <text x="1014" y="400" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565d50">sql</text>

  <!-- Functions -> LanguageTool (external) -->
  <path d="M 866 356 C 830 420, 850 500, 812 540" fill="none" stroke="#565d50" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrowGold)"/>
  <text x="850" y="452" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565d50">deep grammar</text>

  <!-- Corner calipers -->
  <path d="M 24 44 L 24 24 L 44 24" fill="none" stroke="#d9b64a" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 1136 576 L 1136 596 L 1116 596" fill="none" stroke="#d9b64a" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
</svg>
