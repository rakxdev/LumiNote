<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-label="LumiNote architecture: phone and desktop devices stream audio directly to the speech model, relay turns through a SyncRoom Durable Object, and persist notes in D1 behind Pages Functions">
  <defs>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d9b64a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8452c"/>
    </marker>
    <radialGradient id="aglowGold" cx="80%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#d9b64a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#d9b64a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="agrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Obsidian canvas -->
  <rect x="4" y="4" width="1152" height="612" rx="14" fill="#0a0c0f" stroke="#1f242d" stroke-width="1.5"/>
  <rect x="4" y="4" width="1152" height="612" rx="14" fill="url(#aglowGold)"/>
  <rect x="4" y="4" width="1152" height="612" rx="14" fill="url(#agrid)"/>

  <!-- ===== Devices (left column) ===== -->
  <!-- Phone -->
  <g>
    <rect x="52" y="96" width="210" height="128" rx="10" fill="#0f1217" stroke="#1f242d" stroke-width="1.5"/>
    <rect x="52" y="96" width="210" height="30" rx="10" fill="#131720"/>
    <text x="70" y="116" font-family="'Chakra Petch',sans-serif" font-size="14" font-weight="700" fill="#d9b64a">PHONE</text>
    <text x="70" y="152" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">dictation · QR join</text>
    <text x="70" y="170" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">clips · push</text>
    <!-- mic glyph -->
    <rect x="212" y="142" width="12" height="20" rx="6" fill="none" stroke="#d9b64a" stroke-width="2"/>
    <path d="M 206 156 a 12 12 0 0 0 24 0 M 218 168 v 8 M 212 176 h 12" fill="none" stroke="#d9b64a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Desktop -->
  <g>
    <rect x="52" y="404" width="210" height="128" rx="10" fill="#0f1217" stroke="#1f242d" stroke-width="1.5"/>
    <rect x="52" y="404" width="210" height="30" rx="10" fill="#131720"/>
    <text x="70" y="424" font-family="'Chakra Petch',sans-serif" font-size="14" font-weight="700" fill="#d9b64a">DESKTOP</text>
    <text x="70" y="460" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">live editor · polish</text>
    <text x="70" y="478" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">library · vocab</text>
    <!-- screen glyph -->
    <rect x="204" y="448" width="34" height="22" rx="3" fill="none" stroke="#d9b64a" stroke-width="2"/>
    <path d="M 214 476 h 14" stroke="#d9b64a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ===== SyncRoom relay (center) ===== -->
  <g>
    <rect x="392" y="252" width="250" height="132" rx="10" fill="#0f1217" stroke="#d9b64a" stroke-width="1.5" stroke-dasharray="7 5"/>
    <rect x="392" y="252" width="250" height="32" rx="10" fill="#131720"/>
    <text x="412" y="273" font-family="'Chakra Petch',sans-serif" font-size="14" font-weight="700" fill="#d9b64a">SYNCROOM D-O</text>
    <text x="412" y="310" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">hibernating websockets</text>
    <text x="412" y="328" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">turns · clipboard · loudness</text>
    <text x="412" y="346" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">roster · snapshot · 12h ttl</text>
    <text x="412" y="371" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565d50">TOTP room trust window</text>
  </g>

  <!-- ===== Right column: STT + Functions + D1 ===== -->
  <!-- STT -->
  <g>
    <rect x="812" y="96" width="290" height="118" rx="10" fill="#0f1217" stroke="#1f242d" stroke-width="1.5"/>
    <rect x="812" y="96" width="290" height="30" rx="10" fill="#131720"/>
    <text x="830" y="116" font-family="'Chakra Petch',sans-serif" font-size="14" font-weight="700" fill="#d9b64a">SPEECH MODELS</text>
    <text x="830" y="152" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">AssemblyAI Universal-3.5 Pro</text>
    <text x="830" y="170" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">Deepgram Nova-3</text>
    <text x="830" y="196" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565d50">keyterms · voice focus · en pinned</text>
  </g>
  <!-- Functions -->
  <g>
    <rect x="812" y="280" width="290" height="118" rx="10" fill="#0f1217" stroke="#1f242d" stroke-width="1.5"/>
    <rect x="812" y="280" width="290" height="30" rx="10" fill="#131720"/>
    <text x="830" y="300" font-family="'Chakra Petch',sans-serif" font-size="14" font-weight="700" fill="#d9b64a">PAGES FUNCTIONS</text>
    <text x="830" y="336" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">ephemeral STT tokens</text>
    <text x="830" y="354" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">grammar · polish modes</text>
    <text x="830" y="380" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565d50">TOTP login · room trust</text>
  </g>
  <!-- D1 -->
  <g>
    <rect x="812" y="464" width="290" height="118" rx="10" fill="#0f1217" stroke="#1f242d" stroke-width="1.5"/>
    <rect x="812" y="464" width="290" height="30" rx="10" fill="#131720"/>
    <text x="830" y="484" font-family="'Chakra Petch',sans-serif" font-size="14" font-weight="700" fill="#d9b64a">D1 · SQLITE</text>
    <text x="830" y="520" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">notes · clips · transcripts</text>
    <text x="830" y="538" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8e9588">search · pin · export</text>
    <text x="830" y="564" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565d50">app settings · TOTP state</text>
  </g>

  <!-- ===== Edges ===== -->
  <!-- Phone audio: direct to STT (vermilion, the "never via servers" path) -->
  <path d="M 262 160 C 480 60, 620 60, 806 140" fill="none" stroke="#e8452c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowRed)"/>
  <text x="500" y="72" font-family="'JetBrains Mono',monospace" font-size="11" fill="#e8452c">16 kHz PCM — device → model directly</text>
  <text x="520" y="90" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8e9588">audio never touches LumiNote servers</text>

  <!-- Phone <-> relay -->
  <path d="M 262 176 C 320 200, 340 240, 386 268" fill="none" stroke="#d9b64a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowGold)"/>
  <path d="M 392 336 C 340 366, 320 396, 262 436" fill="none" stroke="#d9b64a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowGold)"/>
  <text x="296" y="224" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8e9588">turns · levels</text>
  <text x="288" y="404" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8e9588">live transcript</text>

  <!-- Desktop <-> relay -->
  <path d="M 262 452 C 320 440, 340 412, 386 378" fill="none" stroke="#d9b64a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowGold)"/>
  <path d="M 392 296 C 340 316, 320 336, 262 420" fill="none" stroke="#d9b64a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowGold)"/>

  <!-- Devices -> Functions (REST) -->
  <path d="M 262 132 C 560 40, 700 120, 806 300" fill="none" stroke="#565d50" stroke-width="1.6" marker-end="url(#arrowGold)"/>
  <path d="M 262 500 C 580 560, 690 480, 806 372" fill="none" stroke="#565d50" stroke-width="1.6" marker-end="url(#arrowGold)"/>
  <text x="610" y="540" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565d50">notes REST · tokens · auth</text>

  <!-- Functions -> D1 and Functions -> STT tokens -->
  <path d="M 957 398 L 957 458" fill="none" stroke="#d9b64a" stroke-width="1.6" marker-end="url(#arrowGold)"/>
  <text x="968" y="432" font-family="'JetBrains Mono',monospace" font-size="10" fill="#565d50">sql</text>

  <!-- Corner calipers -->
  <path d="M 24 44 L 24 24 L 44 24" fill="none" stroke="#d9b64a" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 1136 576 L 1136 596 L 1116 596" fill="none" stroke="#d9b64a" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
</svg>
